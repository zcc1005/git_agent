sources:
  repo_0:
    type: codeup
    name: Detection_Agent
    endpoint: https://codeup.aliyun.com/6890767c725067d38cf0aa4d/20260723_Conveyor_Belt_Detection_Agent.git
    branch: zcc
    certificate:
      type: serviceConnection
      serviceConnection: vjo5ea94nbtbdpx5

defaultWorkspace: repo_0

stages:
  stage_0:
    name: 构建GPU镜像
    jobs:
      job_0:
        name: 构建CUDA镜像并推送至ACR
        runsOn:
          group: public/cn-hongkong
          labels: linux,amd64
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          step_0:
            name: 构建并推送GPU镜像
            step: DockerBuildPushACR
            with:
              artifact: artifact
              dockerfilePath: Dockerfile.gpu
              dockerRegistry: crpi-5zyp5pdzn7yrv5oo.cn-beijing.personal.cr.aliyuncs.com/zcc_0811/conveyor-belt-agent
              useVpcAddress: false
              dockerTag: ${DATETIME}
              region: cn-beijing
              cacheType: remote
              serviceConnection: c59b1koh85fauszo
        driven: auto
        plugins: []

  stage_1:
    name: 部署GPU与RTSP服务
    jobs:
      job_1:
        name: GPU Docker Compose部署
        component: DockerDeploy
        with:
          machineGroup: ryfxv6efJN2DhWYB
          serviceConnection: c59b1koh85fauszo
          run: |
            set -eu

            REGISTRY="crpi-5zyp5pdzn7yrv5oo.cn-beijing.personal.cr.aliyuncs.com"
            IMAGE="${REGISTRY}/zcc_0811/conveyor-belt-agent:${DATETIME}"
            DEPLOY_DIR="/opt/belt-agent"
            COMPOSE_FILE="${DEPLOY_DIR}/compose.yaml"
            GPU_COMPOSE_FILE="${DEPLOY_DIR}/compose.gpu.yaml"
            APP_ENV_FILE="${DEPLOY_DIR}/app.env"
            DEMO_VIDEO_PATH="${DEPLOY_DIR}/demo.mp4"
            MEDIAMTX_CONFIG_PATH="${DEPLOY_DIR}/deploy/mediamtx.yml"

            echo "=================================================="
            echo "开始部署GPU传送带异物检测智能体"
            echo "主机名：$(hostname)"
            echo "架构：$(uname -m)"
            echo "镜像：${IMAGE}"
            echo "部署目录：${DEPLOY_DIR}"
            echo "=================================================="

            echo "1. 检查流水线变量"
            test -n "${ACR_USERNAME:-}" || {
              echo "错误：没有配置 ACR_USERNAME"
              exit 1
            }
            test -n "${ACR_PASSWORD:-}" || {
              echo "错误：没有配置保密变量 ACR_PASSWORD"
              exit 1
            }

            echo "2. 检查Docker、Compose和NVIDIA运行环境"
            command -v docker >/dev/null 2>&1 || {
              echo "错误：服务器没有安装Docker"
              exit 1
            }
            docker compose version
            command -v nvidia-smi >/dev/null 2>&1 || {
              echo "错误：服务器没有可用的NVIDIA驱动或nvidia-smi"
              exit 1
            }
            nvidia-smi --query-gpu=index,name,driver_version,memory.total \
              --format=csv,noheader

            echo "3. 登录ACR并拉取本次GPU镜像"
            printf '%s' "${ACR_PASSWORD}" | docker login \
              --username "${ACR_USERNAME}" \
              --password-stdin \
              "${REGISTRY}"
            docker pull "${IMAGE}"
            docker image inspect "${IMAGE}" \
              --format '架构={{.Architecture}} 系统={{.Os}} 大小={{.Size}}'

            echo "4. 在替换旧服务前执行真实GPU推理冒烟测试"
            docker run --rm --gpus all \
              -e CUDA_VISIBLE_DEVICES=0 \
              -e YOLO_DEVICE=0 \
              "${IMAGE}" \
              python -c "import numpy as np, torch; from ultralytics import YOLO; assert torch.cuda.is_available(), '容器无法访问CUDA，请安装/修复nvidia-container-toolkit'; print('GPU:', torch.cuda.get_device_name(0)); print('PyTorch:', torch.__version__, 'CUDA:', torch.version.cuda); model=YOLO('/models/best.pt'); model.predict(source=np.zeros((64,64,3), dtype=np.uint8), imgsz=64, device=0, verbose=False); print('GPU YOLO inference: OK')"
            docker run --rm --entrypoint /bin/sh \
              "${IMAGE}" \
              -c 'test -x /mediamtx && command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264'

            echo "5. 从本次镜像初始化服务器部署文件"
            mkdir -p "${DEPLOY_DIR}/deploy"
            BOOTSTRAP_CONTAINER="$(docker create "${IMAGE}")"
            cleanup_bootstrap() {
              docker rm -f "${BOOTSTRAP_CONTAINER}" >/dev/null 2>&1 || true
            }
            trap cleanup_bootstrap EXIT
            docker cp \
              "${BOOTSTRAP_CONTAINER}:/opt/belt-agent-bootstrap/compose.yaml" \
              "${COMPOSE_FILE}"
            docker cp \
              "${BOOTSTRAP_CONTAINER}:/opt/belt-agent-bootstrap/compose.gpu.yaml" \
              "${GPU_COMPOSE_FILE}"
            docker cp \
              "${BOOTSTRAP_CONTAINER}:/opt/belt-agent-bootstrap/deploy/mediamtx.yml" \
              "${MEDIAMTX_CONFIG_PATH}"
            docker cp \
              "${BOOTSTRAP_CONTAINER}:/opt/belt-agent-bootstrap/demo.mp4" \
              "${DEMO_VIDEO_PATH}"
            cleanup_bootstrap
            trap - EXIT

            if [ ! -s "${APP_ENV_FILE}" ]; then
              C4AI_KEY="${LLM_C4AI_API_KEY:-${LLM_API_KEY:-}}"
              if [ -z "${C4AI_KEY}" ]; then
                echo "错误：服务器没有 app.env，云效也没有配置保密变量 LLM_C4AI_API_KEY"
                echo "请在流水线变量中添加 LLM_C4AI_API_KEY，或手工上传 ${APP_ENV_FILE}"
                exit 1
              fi
              echo "服务器没有 app.env，将使用云效保密变量创建最小运行配置"
              umask 077
              {
                printf '%s\n' "LLM_PROVIDER=c4ai"
                printf '%s\n' "LLM_C4AI_API_KEY=${C4AI_KEY}"
                printf '%s\n' "LLM_C4AI_BASE_URL=${LLM_C4AI_BASE_URL:-https://c4ai.ccccltd.cn/api/compatible/v1}"
                printf '%s\n' "LLM_C4AI_MODEL=${LLM_C4AI_MODEL:-jiaorong-deepseek-v4-pro}"
                printf '%s\n' "LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}"
                printf '%s\n' "LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1600}"
                printf '%s\n' "LLM_JSON_MODE=${LLM_JSON_MODE:-true}"
                printf '%s\n' "LLM_PLANNER_MODE=${LLM_PLANNER_MODE:-hybrid}"
                printf '%s\n' "MAIN_MONITOR_RTSP_URL=rtsp://rtsp:8554/main-monitor"
              } > "${APP_ENV_FILE}"
            else
              echo "复用服务器已有的 ${APP_ENV_FILE}"
            fi
            chmod 600 "${APP_ENV_FILE}"

            for REQUIRED_FILE in \
              "${COMPOSE_FILE}" \
              "${GPU_COMPOSE_FILE}" \
              "${APP_ENV_FILE}" \
              "${DEMO_VIDEO_PATH}" \
              "${MEDIAMTX_CONFIG_PATH}"; do
              if [ ! -s "${REQUIRED_FILE}" ]; then
                echo "错误：部署文件初始化失败：${REQUIRED_FILE}"
                exit 1
              fi
            done

            echo "6. 校验Compose配置"
            export WEB_IMAGE="${IMAGE}"
            export APP_ENV_FILE
            export DEMO_VIDEO_PATH
            export MEDIAMTX_CONFIG_PATH
            docker compose \
              -f "${COMPOSE_FILE}" \
              -f "${GPU_COMPOSE_FILE}" \
              config -q
            RESOLVED_IMAGES="$(
              docker compose \
                -f "${COMPOSE_FILE}" \
                -f "${GPU_COMPOSE_FILE}" \
                config --images | sort -u
            )"
            if [ "${RESOLVED_IMAGES}" != "${IMAGE}" ]; then
              echo "错误：Compose中存在非本次ACR镜像，拒绝部署"
              echo "期望：${IMAGE}"
              echo "实际：${RESOLVED_IMAGES}"
              exit 1
            fi

            echo "7. 停止上一次旧版单容器部署（如存在）"
            docker stop conveyor-belt-agent 2>/dev/null || true
            docker rm conveyor-belt-agent 2>/dev/null || true

            echo "8. 使用已拉取的ACR镜像启动MediaMTX、FFmpeg和GPU Web服务"
            docker compose \
              -f "${COMPOSE_FILE}" \
              -f "${GPU_COMPOSE_FILE}" \
              up -d --no-build --pull never --remove-orphans

            echo "9. 等待应用健康"
            WEB_READY=false
            ATTEMPT=1
            while [ "${ATTEMPT}" -le 18 ]; do
              echo "第 ${ATTEMPT} 次健康检查"
              if docker compose \
                -f "${COMPOSE_FILE}" \
                -f "${GPU_COMPOSE_FILE}" \
                exec -T web \
                python -c "import urllib.request; response=urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=10); assert response.status == 200" \
                >/dev/null 2>&1; then
                WEB_READY=true
                break
              fi
              ATTEMPT=$((ATTEMPT + 1))
              sleep 10
            done
            if [ "${WEB_READY}" != "true" ]; then
              echo "错误：Web服务健康检查失败"
              docker compose \
                -f "${COMPOSE_FILE}" \
                -f "${GPU_COMPOSE_FILE}" \
                ps || true
              docker compose \
                -f "${COMPOSE_FILE}" \
                -f "${GPU_COMPOSE_FILE}" \
                logs --tail=300 web rtsp rtsp-publisher || true
              exit 1
            fi

            echo "10. 强制确认运行中Web服务确实使用CUDA配置"
            docker compose \
              -f "${COMPOSE_FILE}" \
              -f "${GPU_COMPOSE_FILE}" \
              exec -T web \
              python -c "import torch; from project_config import YOLO_DEVICE; assert YOLO_DEVICE == '0', f'YOLO_DEVICE错误: {YOLO_DEVICE}'; assert torch.cuda.is_available(), '运行容器CUDA不可用'; print('CUDA验证通过:', torch.cuda.get_device_name(0))"

            echo "11. 输出最终服务状态"
            docker compose \
              -f "${COMPOSE_FILE}" \
              -f "${GPU_COMPOSE_FILE}" \
              ps
            docker compose \
              -f "${COMPOSE_FILE}" \
              -f "${GPU_COMPOSE_FILE}" \
              logs --tail=100 web rtsp rtsp-publisher

            echo "12. 清理无标签旧镜像"
            docker image prune -f || true

            echo "=================================================="
            echo "GPU与RTSP服务部署成功"
            echo "镜像：${IMAGE}"
            echo "访问地址：http://10.212.116.19:8080"
            echo "RTSP内部地址：rtsp://rtsp:8554/main-monitor"
            echo "=================================================="
